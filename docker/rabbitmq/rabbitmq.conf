## RabbitMQ Broker Configuration
# https://www.rabbitmq.com/configure.html

# Networking
listeners.tcp.default = 5672
management.tcp.port   = 15672

# Load pre-seeded definitions (policies, vhosts, permissions)
# The admin user/pass is created by RABBITMQ_DEFAULT_USER/PASS env vars
management.load_definitions = /etc/rabbitmq/definitions.json

# Logging — structured JSON for log aggregators (Loki, CloudWatch, etc.)
log.console           = true
log.console.level     = info
log.console.formatter = json

# Resource limits (sensible defaults for dev/staging)
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute           = 512MB

# Consumer ack timeout — 30 min before forcing nack → DLX
consumer_timeout = 1800000

# Prometheus metrics endpoint
prometheus.tcp.port = 15692
